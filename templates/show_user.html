{% extends "layout.html" %}

{% block title %} User {{ user.username }}{% endblock %}

{%block content%}
<h2>User {{ user.username }}</h2> 
<p>
    This user has {{ items|count }} vehicles for sale.
</p>
<h3>announcements</h3>
<ul>
    {%for item in items%}
    <li> <a href="/item/{{ item.id }}"> {{ item.title }} </a></li>
    {% endfor %}
</ul>
{% endblock %}
